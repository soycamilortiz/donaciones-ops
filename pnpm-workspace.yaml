packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de build permitidos (pnpm 11 los bloquea por defecto).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  # Telemetría de terceros, no hace falta.
  '@scarf/scarf': false
  # sharp trae binarios nativos; msgpackr-extract lo usa bullmq.
  sharp: true
  msgpackr-extract: true
