# Recarga en caliente. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# El compose base (solo docker compose up) sigue siendo imágenes de producción.

services:
  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - ./apps/api/test:/app/test
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npm run start:dev"]

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY: http://api:3000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
