# Recarga en caliente. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# El compose base (solo docker compose up) sigue siendo imágenes de producción.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/test:/app/apps/api/test
    command: ["sh", "-c", "pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY: http://api:3000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "80"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
    command: ["pnpm", "dev"]
