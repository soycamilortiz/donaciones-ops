services:
  traefik:
    image: traefik:v3.4
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - soschoco
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soschoco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soschoco}
      POSTGRES_DB: ${POSTGRES_DB:-soschoco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soschoco} -d ${POSTGRES_DB:-soschoco}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soschoco
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - soschoco
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-soschoco}:${POSTGRES_PASSWORD:-soschoco}@postgres:5432/${POSTGRES_DB:-soschoco}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://soschoco.localhost}
      JWT_SECRET: ${JWT_SECRET:-soschoco-dev-jwt-secret-cambia-esto}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REDIS_URL: redis://redis:6379
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-sos-choco}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      OPEN_FOOD_FACTS_ENABLED: ${OPEN_FOOD_FACTS_ENABLED:-true}
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org}
      OPEN_FOOD_FACTS_USER_AGENT: ${OPEN_FOOD_FACTS_USER_AGENT:-SOSChoco/1.0 (contacto@soschoco.local)}
      OPEN_FOOD_FACTS_TIMEOUT_MS: ${OPEN_FOOD_FACTS_TIMEOUT_MS:-8000}
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.openai.com/v1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_TIMEOUT_MS: ${VISION_TIMEOUT_MS:-45000}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-SOS Chocó <beth.t@example.com>}"
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - soschoco
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-soschoco}:${POSTGRES_PASSWORD:-soschoco}@postgres:5432/${POSTGRES_DB:-soschoco}
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-sos-choco}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      OCR_CONCURRENCIA: ${OCR_CONCURRENCIA:-2}
      OCR_MAX_INTENTOS: ${OCR_MAX_INTENTOS:-3}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-30000}
      OCR_IDIOMAS: ${OCR_IDIOMAS:-spa+eng}
      OCR_CONFIANZA_MINIMA: ${OCR_CONFIANZA_MINIMA:-0.6}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soschoco
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3100
      REDIS_URL: redis://redis:6379
      JOBS_USER: ${JOBS_USER:-admin}
      JOBS_PASSWORD: ${JOBS_PASSWORD:-cambia-esta-clave}
      JOBS_BASE_PATH: /jobs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soschoco
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    networks:
      - soschoco
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  soschoco:
    name: soschoco
