services:
  traefik:
    image: traefik:v3.4
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - soschoco
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soschoco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soschoco}
      POSTGRES_DB: ${POSTGRES_DB:-soschoco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soschoco} -d ${POSTGRES_DB:-soschoco}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soschoco
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-soschoco}:${POSTGRES_PASSWORD:-soschoco}@postgres:5432/${POSTGRES_DB:-soschoco}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://soschoco.localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - soschoco
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    networks:
      - soschoco
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  soschoco:
    name: soschoco
