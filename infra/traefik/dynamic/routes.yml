http:
  routers:
    api:
      rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`soschoco.localhost`)) && PathPrefix(`/api`)
      entryPoints:
        - web
      priority: 100
      service: api

    jobs:
      rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`soschoco.localhost`)) && PathPrefix(`/jobs`)
      entryPoints:
        - web
      priority: 90
      service: jobs

    web:
      rule: Host(`localhost`) || Host(`127.0.0.1`) || Host(`soschoco.localhost`)
      entryPoints:
        - web
      priority: 1
      service: web

  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:3000
        passHostHeader: true

    jobs:
      loadBalancer:
        servers:
          - url: http://jobs:3100
        passHostHeader: true

    web:
      loadBalancer:
        servers:
          - url: http://web:80
        passHostHeader: true
