<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar producto donado — SOS Chocó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .captura { max-width: 560px; display: flex; flex-direction: column; gap: 18px; }
  .resultado { padding: 18px; background: var(--white); border: 1.5px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 11px; }
  .resultado-ok { border-color: var(--ok); }
  .resultado-warn { border-color: var(--warn); }
  .resultado-err { border-color: var(--danger); }
  .conf { display: flex; align-items: center; gap: 10px; }
  .conf-track { flex: 1; height: 5px; border-radius: 999px; background: var(--ink-150); }
  .conf-fill { height: 5px; border-radius: 999px; background: var(--warn); }
</style>
</head>
<body data-route="/app/donaciones">

<div class="shell">
  <div data-shell></div>

  <div class="main">
    <header class="topbar" data-topbar></header>

    <main class="content">

      <div class="page-head">
        <div class="page-head-copy">
          <p class="eyebrow">Registrar</p>
          <h1 class="page-title">Registrar producto donado</h1>
          <p class="page-sub">Toma una foto del producto. El reconocimiento corre en segundo plano.</p>
        </div>
        <a class="btn-ghost" href="donaciones.html"><span data-ico="arrowLeft"></span>Volver a donaciones</a>
      </div>

      <div class="captura">

        <div class="field">
          <label class="field-label" for="acopio">¿En qué acopio se recibió?</label>
          <select class="select" id="acopio"></select>
          <p class="field-hint">Se recuerda para las próximas fotos de esta organización.</p>
        </div>

        <div id="zona"></div>

        <div id="acciones"></div>

      </div>
    </main>
  </div>
</div>

<script type="module">
  import { el, fill, icon, spinner, productArt, toast } from './assets/app.js';
  import { ACOPIOS } from './assets/data.js';

  const CLAVE = 'soschoco.ultimoAcopio';
  const $ = (id) => document.getElementById(id);
  const activos = ACOPIOS.filter((a) => a.isActive);

  const sel = $('acopio');
  fill(sel, [
    el('option', { value: '', text: 'Sin especificar' }),
    ...activos.map((a) => el('option', { value: a.id, text: a.nombre + (a.municipio ? ` — ${a.municipio}` : '') })),
  ]);
  sel.value = localStorage.getItem(CLAVE) || activos[0]?.id || '';
  sel.addEventListener('change', () => localStorage.setItem(CLAVE, sel.value));

  let fase = 'inicio';
  let resultado = null;

  function pintar() {
    if (fase === 'inicio') {
      fill($('zona'), el('div', { class: 'capture-zone' }, [
        el('div', { class: 'capture-icon' }, icon('camera', 'ico', 2)),
        el('p', { class: 'empty-title', text: 'Una foto por producto' }),
        el('p', { class: 'empty-text', text: 'Encuadra la etiqueta. Se acepta JPEG, PNG, WebP o HEIC, hasta 10 MB.' }),
      ]));
      const b = el('button', { class: 'btn btn-lg btn-block', type: 'button' }, ['Tomar foto', el('span', { class: 'btn-cap' }, icon('camera'))]);
      b.addEventListener('click', tomar);
      fill($('acciones'), b);
      return;
    }

    const foto = el('div', { class: 'photo' }, productArt('lata', 320));

    if (fase === 'subiendo' || fase === 'reconociendo') {
      const paso = fase === 'subiendo' ? 1 : 2;
      fill($('zona'), el('div', { class: 'col gap-16' }, [
        foto,
        el('div', { class: 'card row gap-12' }, [
          spinner(),
          el('p', { class: 'td-strong', text: fase === 'subiendo' ? 'Subiendo la foto…' : 'Reconociendo el producto…' }),
        ]),
        el('div', { class: 'steps' }, [0, 1, 2].map((i) =>
          el('span', { class: i < paso ? 'step step-done' : i === paso ? 'step step-now' : 'step' }))),
        el('div', { class: 'step-labels' }, ['Foto tomada', 'Subida', 'Reconociendo'].map((t) =>
          el('span', { class: 'step-label', text: t }))),
        fase === 'reconociendo'
          ? el('div', { class: 'note' }, [icon('info'), el('p', { class: 'note-text', text: 'Puedes salir de esta pantalla: el proceso sigue y el resultado queda en la lista.' })])
          : null,
      ]));
      fill($('acciones'), []);
      return;
    }

    // fase === 'listo'
    const r = resultado;
    let card;
    if (r.tipo === 'fallida') {
      card = el('div', { class: 'resultado resultado-err' }, [
        el('span', { class: 'badge badge-danger', text: 'No se pudo procesar' }),
        el('p', { class: 'empty-text', style: 'text-align:left', text: 'La foto quedó guardada. Puedes reintentarla desde la lista de donaciones.' }),
      ]);
    } else if (r.tipo === 'sin') {
      card = el('div', { class: 'resultado resultado-warn' }, [
        el('span', { class: 'badge badge-warn', text: 'Sin identificar' }),
        el('p', { class: 'td-strong', text: 'Queda pendiente de revisión' }),
        el('p', { class: 'empty-text', style: 'text-align:left', text: 'No se reconoció el producto con suficiente certeza. Queda pendiente de revisión para que alguien lo confirme a mano.' }),
        el('p', { class: 'section-label', text: 'Texto leído' }),
        el('p', { class: 'ocr', text: r.ocr }),
        el('div', { class: 'conf' }, [
          el('span', { class: 'conf-track' }, el('span', { class: 'conf-fill', style: `width:${Math.round(r.confianza * 100)}%` })),
          el('span', { class: 'td-warn mono', text: `${Math.round(r.confianza * 100)}%` }),
        ]),
      ]);
    } else {
      card = el('div', { class: 'resultado resultado-ok' }, [
        el('span', { class: 'badge badge-ok', text: 'Reconocido' }),
        el('p', { style: 'font-size:22px;font-weight:700;letter-spacing:-.025em', text: r.nombre }),
        el('div', { class: 'row gap-20', style: 'padding-top:12px;border-top:1px solid var(--line)' }, [
          bloque('Certeza', `${Math.round(r.confianza * 100)}%`),
          bloque('Estado', 'Procesada'),
          bloque('Catálogo', r.marca),
        ]),
      ]);
    }

    fill($('zona'), el('div', { class: 'col gap-16' }, [el('div', { class: 'photo' }, productArt('lata', 320)), card]));

    const otro = el('button', { class: 'btn btn-lg', type: 'button' }, ['Registrar otro', el('span', { class: 'btn-cap' }, icon('camera'))]);
    otro.addEventListener('click', () => { fase = 'inicio'; resultado = null; pintar(); });
    fill($('acciones'), el('div', { class: 'row row-wrap gap-12' }, [
      otro,
      el('a', { class: 'btn-ghost', href: 'donaciones.html', text: 'Ver donaciones' }),
      r.tipo === 'sin' || r.tipo === 'fallida'
        ? el('a', { class: 'btn-ghost', href: 'donaciones-revision.html', text: 'Ir a revisión' }) : null,
    ]));
  }

  const bloque = (l, v) => el('div', { class: 'col gap-4' }, [
    el('span', { class: 'stat-label', text: l }),
    el('span', { class: 'td-strong mono', text: v }),
  ]);

  /** El worker resuelve por umbral de certeza: bajo el umbral no asigna producto. */
  function tomar() {
    fase = 'subiendo'; pintar();
    setTimeout(() => { fase = 'reconociendo'; pintar(); }, 800);
    setTimeout(() => {
      const dado = Math.random();
      if (dado < 0.12) resultado = { tipo: 'fallida' };
      else if (dado < 0.45) resultado = { tipo: 'sin', ocr: 'ARR0Z BLANC0 · 5OOg · reg. INV1MA', confianza: 0.41 };
      else resultado = { tipo: 'ok', nombre: 'Arroz blanco Diana 500 g', marca: 'Diana', confianza: 0.94 };
      fase = 'listo';
      pintar();
      if (resultado.tipo === 'ok') toast({ title: 'Producto reconocido', text: resultado.nombre, ico: 'check' });
    }, 2600);
  }

  pintar();
</script>

</body>
</html>
